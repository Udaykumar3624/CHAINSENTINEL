version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chainsentinel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chainsentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainsentinel-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/chainsentinel
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
      ENABLE_DOCS: "true"
      LIVE_DATA_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainsentinel-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
