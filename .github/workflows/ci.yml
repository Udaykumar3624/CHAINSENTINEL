name: ChainSentinel CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest Suite & Alembic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install scikit-learn numpy

      - name: Run Alembic Migration Verification (SQLite)
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          cd backend
          alembic upgrade head
          python app/seed.py
          python app/ml/train.py

      - name: Execute Pytest Suite (48 Tests)
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          cd backend
          python -m pytest -v app/tests/

  frontend-build:
    name: Frontend Typecheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Vite Production Build
        run: |
          cd frontend
          npm run build
