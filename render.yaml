services:
  - type: web
    name: chainsentinel-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 600
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://chainsentinel-5pns.vercel.app,https://chainsentinel.vercel.app"
      - key: DATABASE_URL
        value: sqlite:///./chainsentinel.db
